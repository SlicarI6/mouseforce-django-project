{% extends "base.html" %}
{% block content %}
  <h2>Customer Chats</h2>
  <ul>
    {% for user in users %}
      <li>
        👤 {{ user.username }}
        <a href="{% url 'chat_room' room_name=user.username %}">[Open Chat]</a>
      </li>
    {% empty %}
      <li>No customers available.</li>
    {% endfor %}
  </ul>
{% endblock %}
