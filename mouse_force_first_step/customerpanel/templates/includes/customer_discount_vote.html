<form class="deal-vote" method="post" action="{{ deal.vote_url }}" data-deal-vote aria-label="Community vote for {{ deal.brand }}">
  {% csrf_token %}
  <button type="submit" name="value" value="{% if deal.vote == 1 %}0{% else %}1{% endif %}" data-vote-direction="1" aria-label="{% if deal.vote == 1 %}Remove like{% else %}Like this deal{% endif %}, {{ deal.likes }} likes" aria-pressed="{% if deal.vote == 1 %}true{% else %}false{% endif %}" {% if not deal.current %}disabled{% endif %}><span class="deal-vote-icon" aria-hidden="true">👍</span>{% if not icons_only %}<span>Like</span>{% endif %}<span class="deal-vote-count" data-vote-count>{{ deal.likes }}</span></button>
  <button type="submit" name="value" value="{% if deal.vote == -1 %}0{% else %}-1{% endif %}" data-vote-direction="-1" aria-label="{% if deal.vote == -1 %}Remove dislike{% else %}Dislike this deal{% endif %}, {{ deal.dislikes }} dislikes" aria-pressed="{% if deal.vote == -1 %}true{% else %}false{% endif %}" {% if not deal.current %}disabled{% endif %}><span class="deal-vote-icon" aria-hidden="true">👎</span>{% if not icons_only %}<span>Dislike</span>{% endif %}<span class="deal-vote-count" data-vote-count>{{ deal.dislikes }}</span></button>
</form>
